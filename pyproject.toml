[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-cyber-operations-platform"
version = "0.5.0"
description = "Stable single-source campus cyber monitoring platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "psutil>=7,<8",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "httpx>=0.28,<1",
]
build = [
  "pyinstaller>=6.16,<7",
]

[project.scripts]
campus-ops = "campus_ops.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campus_ops = ["ui/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/campus_ops/diagnostic_ui.py" = ["I001"]
"src/campus_ops/pathspace_ui.py" = ["I001"]
"src/campus_ops/stable_operator_ui.py" = ["I001"]
"src/campus_ops/stable_ui.py" = ["I001"]
"src/campus_ops/topology_ui.py" = ["I001"]
"src/campus_ops/workers/asset_engine.py" = ["I001"]
"src/campus_ops/workers/flow_engine.py" = ["I001"]
"src/campus_ops/workers/incidents.py" = ["I001"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-cyber-operations-platform"
version = "0.3.0"
description = "Windows-native campus cyber operations platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "psutil>=7,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
build = [
  "pyinstaller>=6.16,<7",
]

[project.scripts]
campus-ops = "campus_ops.main:main"
campus-ops-agent = "campus_ops.agent:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campus_ops = ["ui/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/campus_ops/advanced_layer.py" = ["I001", "F401"]
"src/campus_ops/context_assistant.py" = ["I001"]
"src/campus_ops/enterprise_layer.py" = ["I001"]
"src/campus_ops/operator_refinement.py" = ["I001"]
"src/campus_ops/runtime_ui.py" = ["I001"]
"src/campus_ops/workers/incidents.py" = ["I001"]
"src/campus_ops/workers/operations_watchdog.py" = ["SIM114"]

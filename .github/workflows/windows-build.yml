name: windows-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release executable
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Smoke check artifact
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/MONWindows.exe')) { throw 'MONWindows.exe missing' }
          Get-Item 'dist/MONWindows.exe' | Format-List Name,Length,LastWriteTime
          Get-FileHash 'dist/MONWindows.exe' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: MONWindows-1.0
          path: dist/MONWindows.exe
          if-no-files-found: error

name: ubuntu-ci
on:
  push:
    branches: [monitor-v1, 'codex/ubuntu-*']
  pull_request:
    branches: [monitor-v1, main]

# A direct monitor-v1 push and its PR update can otherwise create duplicate four-job
# matrices. Use the head branch as the shared key and keep only the newest pipeline.
concurrency:
  group: ubuntu-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Lint
        run: ruff check src tests scripts/configure_ubuntu.py
      - name: Validate Linux installers and bootstrap
        run: |
          bash -n bootstrap.sh
          bash -n scripts/install_ubuntu.sh
          bash -n scripts/install_kali.sh
          bash -n scripts/repair_capture_permissions.sh
          bash scripts/install_kali.sh --plan --interface auto | grep -q 'interface: auto'
      - name: Tests
        run: pytest -q
  bootstrap:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install full Ubuntu stack and verify services
        shell: bash
        run: |
          set +e
          sudo bash scripts/install_ubuntu.sh --interface auto
          install_status=$?
          set -e
          if [[ $install_status != 0 && $install_status != 2 ]]; then exit "$install_status"; fi
          sudo bash scripts/repair_capture_permissions.sh --user "$USER"
          sudo systemctl restart campus-ops.service
          sudo /opt/campus-ops/venv/bin/python - <<'PY'
          from campus_ops.deployment_check import check
          report = check()
          # Hosted kernels without BTF explicitly cannot run Falco; every
          # other install or service failure remains a failing deployment gate.
          problems = [p for p in report['problems'] if not p.startswith('falco: BLOCKED')]
          assert not problems, problems
          assert report['capture']['verified']
          assert report['capture']['interface'] not in {None, 'any'}, report['capture']
          PY
      - name: Verify automatic physical interface and service restart
        run: |
          sudo systemctl restart campus-ops-sensor@zeek.service
          sleep 8
          sudo /opt/campus-ops/venv/bin/python - <<'PY'
          from campus_ops.deployment import deployment_status
          status = deployment_status()['sensors']['zeek']
          assert status['state'] == 'RUNNING', status
          assert status['interface'] not in {None, 'any', 'lo'}, status
          PY
      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p bootstrap-logs
          sudo journalctl -u campus-ops -u campus-ops-falco -u 'campus-ops-sensor@*' --no-pager > bootstrap-logs/journal.txt
          sudo cp -r /var/lib/campus-ops/install /var/log/campus-ops /run/campus-ops-sensors bootstrap-logs/ || true
          sudo chmod -R a+rX bootstrap-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-${{ matrix.os }}
          path: bootstrap-logs

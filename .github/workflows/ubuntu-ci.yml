name: ubuntu-ci
on:
  push:
    branches: [monitor-v1, 'codex/ubuntu-*']
  pull_request:
    branches: [monitor-v1, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Lint
        run: ruff check src tests scripts/configure_ubuntu.py
      - name: Validate Ubuntu installer
        run: bash -n scripts/install_ubuntu.sh
      - name: Preserve existing UI
        run: |
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", "12ef976c6c227d1939ad5fb59db53c64953763d8", "HEAD"],
              text=True,
          ).splitlines()
          changed = [p for p in paths if p.startswith("src/") and (
              p.endswith(("_ui.py", ".html", ".css", ".js")) or "/ui/" in p)]
          assert not changed, f"UI changes are outside the authorized scope: {changed}"
          PY
      - name: Tests
        run: pytest -q
  bootstrap:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install full Ubuntu stack and verify services
        shell: bash
        run: |
          set +e
          sudo bash scripts/install_ubuntu.sh --interface any
          install_status=$?
          set -e
          if [[ $install_status != 0 && $install_status != 2 ]]; then exit "$install_status"; fi
          sudo /opt/campus-ops/venv/bin/python - <<'PY'
          from campus_ops.deployment_check import check
          report = check()
          # Hosted/WSL kernels without BTF explicitly cannot run Falco; every
          # other install or service failure remains a failing deployment gate.
          problems = [p for p in report['problems'] if not p.startswith('falco: BLOCKED')]
          assert not problems, problems
          assert report['capture']['verified']
          PY
      - name: Verify capture on all interfaces and service restart
        run: |
          sudo systemctl restart campus-ops-sensor@zeek.service
          sleep 8
          sudo /opt/campus-ops/venv/bin/python - <<'PY'
          from campus_ops.deployment import deployment_status
          status = deployment_status()['sensors']['zeek']
          assert status['state'] == 'RUNNING', status
          assert status['interface'] == 'any', status
          PY
      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p bootstrap-logs
          sudo journalctl -u campus-ops -u campus-ops-falco -u 'campus-ops-sensor@*' --no-pager > bootstrap-logs/journal.txt
          sudo cp -r /var/lib/campus-ops/install /var/log/campus-ops /run/campus-ops-sensors bootstrap-logs/ || true
          sudo chmod -R a+rX bootstrap-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-${{ matrix.os }}
          path: bootstrap-logs

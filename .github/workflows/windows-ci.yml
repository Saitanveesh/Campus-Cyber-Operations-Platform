name: windows-ci

on:
  push:
    branches: [windows-native-v2]
  pull_request:
    branches: [windows-native-v2, main]

concurrency:
  group: windows-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m pip check
      - name: Lint
        run: ruff check src tests
      - name: PowerShell syntax gate
        shell: pwsh
        run: |
          $files = @('bootstrap.ps1','scripts/build_windows.ps1','scripts/install_windows_service.ps1','scripts/diagnose_windows.ps1')
          foreach ($file in $files) {
            [void][ScriptBlock]::Create((Get-Content -Raw $file))
            Write-Host "Parsed $file"
          }
      - name: Windows test suite
        run: pytest -q
